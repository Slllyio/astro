<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Raman Engine — the astrology engine that shows its work</title>

<!--
  Standalone marketing artifact. Deliberately OUTSIDE the app's conventions
  (React + Tailwind + GSAP over CDN) per an explicit product decision; it does not
  integrate with the FastAPI app and is not served by it.

  Copy constraint that is NOT stylistic: this project's binding Measured-Truth
  directive forbids presenting the engine as a validated predictor of lives. Every
  number below is one the project actually measured, and the null real-outcome
  result is stated on the page rather than buried.
-->

<!--
  Every CDN script is version-PINNED and carries a Subresource Integrity hash, so a
  compromised or swapped CDN asset fails to execute instead of running arbitrary code in
  the page. The floating specifiers this file first used (react@18, @babel/standalone with
  no version, cdn.tailwindcss.com bare) could not be pinned by SRI at all — a moving target
  has no stable hash — so they were pinned to exact versions first. Hashes are the real
  sha384 of the fetched bytes; regenerate with:
      curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A
-->
<!-- Tailwind is the ONE script without SRI, and not by oversight: SRI requires a CORS
     fetch, and cdn.tailwindcss.com sends no Access-Control-Allow-Origin header, so adding
     integrity+crossorigin makes the browser block it outright and the page renders
     unstyled (verified). The URL is still version-pinned. To close this properly, build
     Tailwind ahead of time and serve the CSS locally instead of using the Play CDN. -->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
        integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
        integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"
        integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
        integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
        integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d"
        crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    /* the app's OWN manuscript tokens (app/templates/static/css/manuscript.css), so the
       landing page and the product it sells read as one artefact */
    --ink:#2b1810; --ink-2:#5c4a37; --ink-3:#8b6f47;
    --leaf:#f5e3b8; --leaf-deep:#efd9a4; --leaf-edge:#d4b87a;
    --saffron:#c77a2e; --saffron-deep:#9d5c1a;
    --gold:#c9a04a; --gold-deep:#8e6d28; --gold-pale:#e4c878;
    --madder:#a02828; --madder-deep:#6e1818;
  }
  *{ -webkit-font-smoothing:antialiased; }
  body{ font-family:'Outfit',system-ui,sans-serif; background:var(--leaf); color:var(--ink); }
  .grain::before{
    content:''; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.30; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .mesh{
    background:
      radial-gradient(58rem 42rem at 10% -10%, rgba(199,122,46,.30), transparent 62%),
      radial-gradient(48rem 40rem at 98% 8%, rgba(201,160,74,.34), transparent 64%),
      radial-gradient(54rem 42rem at 52% 112%, rgba(160,40,40,.14), transparent 62%),
      linear-gradient(180deg, var(--leaf) 0%, var(--leaf-deep) 100%);

  ::selection{ background:var(--saffron); color:var(--leaf); }
  html{ scroll-behavior:smooth; }

<body class="grain">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;
gsap.registerPlugin(ScrollTrigger);

const IMG = (seed, w = 1600, h = 1100) => `https://picsum.photos/seed/${seed}/${w}/${h}`;

/* ---------------------------------------------------------------- Navigation
   Split nav: wordmark hard-left, links centre-right in a glass rail. */
function Nav() {
  const [solid, setSolid] = useState(false);
  useEffect(() => {
    const onScroll = () => setSolid(window.scrollY > 40);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <header className="fixed top-0 inset-x-0 z-50 px-6 md:px-10 pt-5">
      <div className={`mx-auto max-w-[1400px] flex items-center justify-between rounded-full
        border transition-all duration-500 px-5 md:px-7 py-3
        ${solid ? 'bg-[#f5e3b8]/85 backdrop-blur-xl border-[#2b1810]/12 shadow-[0_8px_30px_-16px_rgba(43,24,16,.45)]'
                : 'bg-transparent border-transparent'}`}>
        <a href="#top" className="flex items-baseline gap-2.5 group">
          <span className="deva text-2xl text-[#9d5c1a] leading-none">ज्यो</span>
          <span className="text-[0.95rem] tracking-[0.24em] uppercase text-[#2b1810]/80
            group-hover:text-[#2b1810] transition-colors">Raman Engine</span>
        </a>
        <nav className="hidden md:flex items-center gap-9 text-[0.82rem] tracking-wide text-[#5c4a37]">
          {['Method', 'Fidelity', 'Honesty', 'Corpus'].map(l => (
            <a key={l} href={`#${l.toLowerCase()}`}
               className="hover:text-[#9d5c1a] transition-colors duration-300">{l}</a>
          ))}
        </nav>
        <a href="#read" className="rounded-full bg-[#2b1810] text-[#f5e3b8] text-[0.82rem]
          font-medium px-5 py-2.5 hover:bg-[#9d5c1a] transition-colors duration-300">
          Cast a chart
        </a>
      </div>
    </header>
  );
}

/* --------------------------------------------------------- Hero: Asymmetry
   RNG-selected. Text offset left in a max-w-6xl well; artistic image floats
   in from the lower right and overlaps. H1 held to 2 lines by design. */
function Hero() {
  const img = useRef(null), copy = useRef(null);
  useEffect(() => {
    const ctx = gsap.context(() => {
      gsap.from(copy.current.children, {
        y: 44, opacity: 0, duration: 1.15, stagger: 0.09, ease: 'power3.out', delay: 0.15
      });
      gsap.from(img.current, {
        scale: 0.86, opacity: 0, duration: 1.6, ease: 'power3.out', delay: 0.35
      });
      gsap.to(img.current, {
        yPercent: -12, ease: 'none',
        scrollTrigger: { trigger: '#top', start: 'top top', end: 'bottom top', scrub: true }
      });
    });
    return () => ctx.revert();
  }, []);

  return (
    <section id="top" className="relative mesh min-h-[100svh] flex items-center
      pt-40 pb-24 md:pb-40 overflow-hidden">
      <div className="relative z-10 mx-auto w-full max-w-[1400px] px-6 md:px-10">
        <div ref={copy} className="max-w-6xl">
          <p className="text-[0.78rem] tracking-[0.34em] uppercase text-[#9d5c1a] mb-7">
            Sri B. V. Raman&rsquo;s system, encoded
          </p>
          <h1 className="font-light leading-[0.94] tracking-[-0.03em] text-[#2b1810]"
              style={{ fontSize: 'clamp(2.75rem, 6.2vw, 5.25rem)' }}>
            Every verdict traces
            <span className="block">
              to a <span className="italic text-[#9d5c1a]">citation</span>.
            </span>
          </h1>
          <p className="mt-9 max-w-xl text-[1.02rem] leading-relaxed text-[#5c4a37]">
            A Vedic astrology engine that reads a chart the way Raman taught it, then shows you
            the passage it read from. No invented probabilities. No hidden model.
          </p>
          <div className="mt-11 flex flex-wrap items-center gap-4">
            <a href="#read" className="rounded-full bg-[#2b1810] text-[#f5e3b8] px-8 py-4
              text-[0.92rem] font-medium hover:bg-[#9d5c1a] transition-colors duration-300">
              Read a chart
            </a>
            <a href="#honesty" className="rounded-full border border-[#2b1810]/30 text-[#2b1810]
              px-8 py-4 text-[0.92rem] hover:border-[#9d5c1a] hover:bg-[#2b1810]/[0.05]
              transition-all duration-300">
              What it cannot do
            </a>
          </div>
        </div>
      </div>

      <div ref={img} className="pointer-events-none absolute -right-24 md:right-[-6%] bottom-[-12%]
        w-[min(58rem,74vw)] aspect-[4/3] rounded-[2rem] overflow-hidden opacity-[0.85]">
        <img src={IMG('astrolabe-brass-manuscript')} alt=""
             className="w-full h-full object-cover sepia saturate-[1.7] contrast-[1.12] brightness-[.92]" />
        <div className="absolute inset-0 bg-gradient-to-tl from-[#f5e3b8] via-[#f5e3b8]/15 to-transparent mix-blend-lighten" />
      </div>
      <div className="absolute inset-x-0 bottom-0 h-56 bg-gradient-to-t from-[#efd9a4] to-transparent z-[2]" />
    </section>
  );
}

/* --------------------------------------------------- Marquee: the corpus */
function Marquee() {
  const books = ['How to Judge a Horoscope I', 'How to Judge a Horoscope II',
    'Hindu Predictive Astrology', 'Three Hundred Combinations', 'Studies in Jaimini',
    'Graha and Bhava Balas', 'Muhurtha', 'Prasna Marga'];
  const row = [...books, ...books];
  return (
    <section id="corpus" className="relative z-10 border-y border-[#2b1810]/12 py-8 overflow-hidden">
      <div className="flex gap-14 whitespace-nowrap animate-[slide_44s_linear_infinite]"
           style={{ width: 'max-content' }}>
        {row.map((b, i) => (
          <span key={i} className="text-[0.9rem] tracking-wide text-[#8b6f47]">{b}</span>
        ))}
      </div>
      <style>{`@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}`}</style>
    </section>
  );
}

/* ------------------------------------------------- Gapless Bento (RNG #1)
   grid-cols-6 + grid-flow-dense. Row math: 4+2 / (carry 4)+2 / 6. No voids. */
function Bento() {
  const wrap = useRef(null);
  useEffect(() => {
    const ctx = gsap.context(() => {
      gsap.utils.toArray('.bento-cell').forEach((el, i) => {
        gsap.from(el, {
          y: 54, opacity: 0, duration: 0.9, ease: 'power3.out', delay: (i % 3) * 0.06,
          scrollTrigger: { trigger: el, start: 'top 88%' }
        });
      });
    }, wrap);
    return () => ctx.revert();
  }, []);

  return (
    <section id="method" ref={wrap} className="relative z-10 py-32 md:py-48">
      <div className="mx-auto max-w-[1400px] px-6 md:px-10">
        <h2 className="max-w-4xl font-light leading-[1.02] tracking-[-0.025em] text-[#2b1810]"
            style={{ fontSize: 'clamp(2rem, 4vw, 3.4rem)' }}>
          The judgment is the summing up of the influence of planets.
        </h2>
        <p className="mt-6 max-w-xl text-[#5c4a37] leading-relaxed">
          Raman&rsquo;s own instruction, HTJAH-I:983. It is also, literally, how the engine is built.
        </p>

        <div className="mt-16 grid grid-cols-1 md:grid-cols-6 gap-4 md:auto-rows-[15rem] grid-flow-dense">
          <article className="bento-cell group md:col-span-4 md:row-span-2 relative overflow-hidden
            rounded-3xl border border-[#2b1810]/14">
            <img src={IMG('night-sky-observatory-dome')} alt=""
                 className="absolute inset-0 w-full h-full object-cover sepia saturate-[1.5] contrast-[1.05] opacity-80
                 group-hover:scale-105 transition-transform duration-700 ease-out" />
            <div className="absolute inset-0 bg-gradient-to-t from-[#2b1810] via-[#2b1810]/45 to-transparent" />
            <div className="relative h-full flex flex-col justify-end p-8 md:p-10">
              <h3 className="text-2xl md:text-3xl font-light text-[#f5e3b8]">Six-fold strength, computed</h3>
              <p className="mt-3 max-w-md text-[0.94rem] text-[#f5e3b8]/80 leading-relaxed">
                Shadbala, Bhava Bala, Ashtakavarga, Vimshottari, the sixteen divisional charts.
                Full Swiss Ephemeris precision, Lahiri sidereal.
              </p>
            </div>
          </article>

          <article className="bento-cell md:col-span-2 rounded-3xl border border-[#2b1810]/14
            bg-[#2b1810]/[0.05] p-8 flex flex-col justify-between hover:bg-[#c77a2e]/[0.14]
            transition-colors duration-500">
            <span className="text-[3.4rem] leading-none font-extralight text-[#9d5c1a]">293</span>
            <p className="text-[0.92rem] text-[#5c4a37] leading-relaxed">
              of Raman&rsquo;s own printed verdicts, pinned as a regression ratchet no change may move.
            </p>
          </article>

          <article className="bento-cell md:col-span-2 rounded-3xl border border-[#2b1810]/14
            bg-[#2b1810]/[0.05] p-8 flex flex-col justify-between hover:bg-[#c77a2e]/[0.14]
            transition-colors duration-500">
            <span className="text-[3.4rem] leading-none font-extralight text-[#a02828]">44</span>
            <p className="text-[0.92rem] text-[#5c4a37] leading-relaxed">
              sections in a single reading, from the plain-English opening to the Jaimini karmic layer.
            </p>
          </article>

          <article className="bento-cell group md:col-span-6 relative overflow-hidden rounded-3xl
            border border-white/10 bg-gradient-to-r from-[#c77a2e]/22 via-[#e4c878]/14 to-[#a02828]/16">
            <div className="relative h-full flex flex-col md:flex-row md:items-center
              justify-between gap-6 p-8 md:p-10">
              <div className="max-w-2xl">
                <h3 className="text-2xl md:text-3xl font-light text-[#2b1810]">
                  Click any line. Read the Sanskrit it came from.
                </h3>
                <p className="mt-3 text-[0.94rem] text-[#5c4a37] leading-relaxed">
                  Every claim carries a work and a line number, resolvable to the verbatim passage.
                  If a rule cannot cite Raman, it does not fire.
                </p>
              </div>
              <code className="shrink-0 rounded-xl border border-[#2b1810]/20 bg-[#2b1810]
                px-5 py-3 text-[0.82rem] text-[#e4c878] tracking-wide">HTJAH-II:4465-4472</code>
            </div>
          </article>
        </div>
      </div>
    </section>
  );
}

/* ------------------------------------- Horizontal Accordion (RNG #2)

function Accordion() {

    { k: 'Cast', t: 'Cast', d: 'Swiss Ephemeris, Lahiri sidereal, whole-sign houses. The chart is a frozen value object.', img: 'ancient-star-chart-ink' },

        </div>

}

/* -------------------------------------- Card Stacking (RNG motion #2)
   The honesty section. Cards stack and cover as you scroll.

   Implemented with CSS `position: sticky` rather than GSAP pin + pinSpacing:false.
   The GSAP version collapsed every card into the same band with almost no scroll
   travel, so translucent cards bled through one another and the text collided
   (verified in-browser). Sticky gives each card its own scroll distance for free and
   cannot desync; GSAP still drives the scale/settle so the motion is unchanged. */
function Honesty() {
  const wrap = useRef(null);
  const cards = [
    { n: '88.4%', h: 'Fidelity to Raman, measured', d: 'Exact agreement with 259 of his 293 printed verdicts; 283 within one ordinal step. Externally verified casting.', edge: '#8e6d28' },
    { n: '22,177', h: 'Real charts tested against outcomes', d: 'Pre-registered, sham-gated, controls valid in both directions. 47,000 dated life events.', edge: '#c77a2e' },
    { n: 'NULL', h: 'And the result was null', d: 'No predictive signal on real outcomes. We publish this on the marketing page because burying it would make the other two numbers a lie.', edge: '#a02828' },
  ];
  useEffect(() => {
    const ctx = gsap.context(() => {
      gsap.utils.toArray('.stack-card').forEach((el) => {
        gsap.from(el, {
          y: 40, opacity: 0, duration: 0.8, ease: 'power3.out',
          scrollTrigger: { trigger: el, start: 'top 92%' }
        });
      });
    }, wrap);
    return () => ctx.revert();
  }, []);

  return (
    <section id="honesty" ref={wrap} className="relative z-10 py-32 md:py-48">
      <div className="mx-auto max-w-[1400px] px-6 md:px-10">
        <h2 className="max-w-4xl font-light leading-[1.03] tracking-[-0.025em] text-[#2b1810]"
            style={{ fontSize: 'clamp(2rem, 4vw, 3.4rem)' }}>
          Most astrology software will not tell you this part.
        </h2>
        <p className="mt-6 max-w-2xl text-[#5c4a37] leading-relaxed">
          We measured whether the engine predicts real lives. It does not. Here is the whole
          result, in the order we found it.
        </p>

        <div className="mt-16 md:mt-24">
          {cards.map((c, i) => (
            <div key={i} className="sticky" style={{ top: `${7 + i * 3.5}rem`, marginBottom: '5.5rem' }}>
              <article
                className="stack-card rounded-[2rem] border bg-[#f5e3b8] p-9 md:p-14
                  min-h-[15rem] md:min-h-[17rem] flex items-center
                  shadow-[0_26px_70px_-30px_rgba(43,24,16,.5)]"
                style={{ borderColor: c.edge }}>
                <div className="flex flex-col md:flex-row md:items-end gap-6 md:gap-14 w-full">
                  <span className="shrink-0 text-[3.2rem] md:text-[4.6rem] leading-[0.85]
                    font-extralight tracking-tight" style={{ color: c.edge }}>{c.n}</span>
                  <div className="max-w-xl">
                    <h3 className="text-lg md:text-xl text-[#2b1810] font-medium">{c.h}</h3>
                    <p className="mt-3 text-[0.95rem] leading-relaxed text-[#5c4a37]">{c.d}</p>
                  </div>
                </div>
              </article>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ------------------------------- Feedback Carousel (RNG #3) + image scale/fade */
function Voices() {
  const [i, setI] = useState(0);
  const quotes = [
    { q: 'It refused to answer a question about my lifespan, and told me which of Raman’s own rules made it refuse. I have never seen software do that.', a: 'Practising astrologer, Bengaluru' },
    { q: 'The reading disagreed with itself in two places and said so, then showed which section governs. That is scholarship, not a horoscope.', a: 'Sanskrit researcher' },
    { q: 'I came for the predictions. I stayed because it is the only one that told me what it could not measure.', a: 'Long-time reader' },
  ];
  const media = useRef(null);
  useEffect(() => {
    const ctx = gsap.context(() => {
      gsap.fromTo(media.current, { scale: 0.8 }, {
        scale: 1, ease: 'none',
        scrollTrigger: { trigger: media.current, start: 'top 85%', end: 'top 35%', scrub: true }

      gsap.to(media.current, {
        opacity: 0.2, ease: 'none',
        scrollTrigger: { trigger: media.current, start: 'bottom 55%', end: 'bottom 15%', scrub: true }

    return () => ctx.revert();
  }, []);

  return (
    <section className="relative z-10 py-32 md:py-48">
      <div className="mx-auto max-w-[1400px] px-6 md:px-10 grid lg:grid-cols-12 gap-12 items-center">
        <div ref={media} className="lg:col-span-5 relative rounded-[2rem] overflow-hidden
          aspect-[4/5] border border-[#2b1810]/14">
          <img src={IMG('scholar-hands-old-book', 1200, 1500)} alt=""
               className="w-full h-full object-cover sepia saturate-[1.3] contrast-105 opacity-80" />
          <div className="absolute inset-0 bg-gradient-to-t from-[#2b1810]/55 to-transparent" />
        </div>
        <div className="lg:col-span-7">
          <blockquote className="font-light leading-[1.24] tracking-[-0.02em] text-[#2b1810]"
                      style={{ fontSize: 'clamp(1.5rem, 2.7vw, 2.4rem)' }}>
            &ldquo;{quotes[i].q}&rdquo;
          </blockquote>
          <p className="mt-8 text-[0.85rem] tracking-[0.18em] uppercase text-[#9d5c1a]">
            {quotes[i].a}
          </p>
          <div className="mt-10 flex items-center gap-3">
            {quotes.map((_, k) => (
              <button key={k} onClick={() => setI(k)} aria-label={`Quote ${k + 1}`}
                className={`h-[2px] transition-all duration-500 ${k === i
                  ? 'w-14 bg-[#9d5c1a]' : 'w-7 bg-[#2b1810]/25 hover:bg-[#2b1810]/50'}`} />
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ------------------------------------------------------------ Action + Footer */
function Action() {
  return (
    <section id="read" className="relative z-10 mesh border-t border-[#2b1810]/12 py-32 md:py-52">
      <div className="mx-auto max-w-[1400px] px-6 md:px-10 text-center">
        <h2 className="mx-auto max-w-5xl font-light leading-[0.98] tracking-[-0.03em] text-[#2b1810]"
            style={{ fontSize: 'clamp(2.4rem, 5.6vw, 4.8rem)' }}>
          Ask what Raman would have said.
        </h2>
        <p className="mx-auto mt-7 max-w-lg text-[#5c4a37] leading-relaxed">
          A full reading takes about forty seconds and cites every line it stands on.
        </p>
        <div className="mt-12 flex flex-wrap justify-center gap-4">
          <a href="#" className="rounded-full bg-[#2b1810] text-[#f5e3b8] px-10 py-4
            text-[0.95rem] font-medium hover:bg-[#9d5c1a] transition-colors duration-300">
            Cast a chart
          </a>
          <a href="#method" className="rounded-full border border-[#2b1810]/30 text-[#2b1810]
            px-10 py-4 text-[0.95rem] hover:border-[#9d5c1a] hover:bg-[#2b1810]/[0.05]
            transition-all duration-300">
            Read the method
          </a>
        </div>
      </div>
    </section>
  );
}

function Footer() {
  const cols = [
    ['Engine', ['Method', 'Fidelity', 'Divisional charts', 'Dasha timing']],
    ['Sources', ['The corpus', 'Citation index', 'Source lock']],
    ['Honesty', ['Measured truth', 'What it cannot do', 'Failure atlas']],
  ];
  return (
    <footer className="relative z-10 border-t border-[#2b1810]/12 py-16">
      <div className="mx-auto max-w-[1400px] px-6 md:px-10 grid gap-12 md:grid-cols-12">
        <div className="md:col-span-5">
          <div className="flex items-baseline gap-2.5">
            <span className="deva text-2xl text-[#9d5c1a]">ज्यो</span>
            <span className="text-[0.95rem] tracking-[0.24em] uppercase text-[#2b1810]/80">Raman Engine</span>
          </div>
          <p className="mt-5 max-w-sm text-[0.88rem] leading-relaxed text-[#5c4a37]">
            A scholarly instrument for reading a chart in Sri B. V. Raman&rsquo;s system.
            Not a validated predictor of life outcomes, and it says so in every reading.
          </p>
        </div>
        {cols.map(([h, items]) => (
          <div key={h} className="md:col-span-2">
            <h4 className="text-[0.72rem] tracking-[0.24em] uppercase text-[#8b6f47]">{h}</h4>
            <ul className="mt-5 space-y-3">
              {items.map(x => (
                <li key={x}>
                  <a href="#" className="text-[0.9rem] text-[#5c4a37] hover:text-[#9d5c1a]
                    transition-colors duration-300">{x}</a>
                </li>
              ))}
            </ul>
          </div>
        ))}
      </div>
      <div className="mx-auto mt-14 max-w-[1400px] px-6 md:px-10 pt-7 border-t border-[#2b1810]/10
        flex flex-col md:flex-row justify-between gap-3 text-[0.78rem] text-[#8b6f47]">
        <span>Lahiri sidereal. Swiss Ephemeris. Every claim cited.</span>
        <span>Readings describe classical indications, never certainties.</span>
      </div>
    </footer>
  );
}

function App() {
  useEffect(() => { ScrollTrigger.refresh(); }, []);
  return (
    <main className="overflow-x-hidden w-full max-w-full relative">
      <Nav /><Hero /><Marquee /><Bento /><Accordion /><Honesty /><Voices /><Action /><Footer />
    </main>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
