[tool.pytest.ini_options]
# Add the project root to sys.path so `from app.X import Y` resolves
# whether pytest is invoked as `pytest`, `python -m pytest`, or via CI.
# Without this, Linux CI hits ModuleNotFoundError: No module named 'app'
# because the `pytest` console script does not implicitly add cwd to sys.path
# (whereas `python -m pytest` does).
pythonpath = ["."]
testpaths = ["tests"]
# auto-mode: async functions are picked up without explicit @pytest.mark.asyncio.
# Sync tests stay sync without triggering strict-mode warnings (which fire when
# a module-level pytestmark applies the asyncio marker to a sync function).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
