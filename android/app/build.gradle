plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.slllyio.astro'
    compileSdk 34

    defaultConfig {
        applicationId 'io.slllyio.astro'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // Baked-in backend URL (from gradle.properties or -PBACKEND_URL=...).
        def backend = project.findProperty('BACKEND_URL') ?: 'https://REPLACE_ME'
        buildConfigField 'String', 'BACKEND_URL', "\"${backend}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
}
