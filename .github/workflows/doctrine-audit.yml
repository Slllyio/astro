name: Doctrine audit (quarterly)

# Quarterly cron that stages a Bangalore-baseline reading + an audit-prompt
# markdown so the doctrine reviewer agent has fresh material to review.
#
# IMPORTANT — NOT a blocking CI gate.
#
# Per spec Section 7, the actual `bphs-doctrine-reviewer` agent dispatch
# is a MANUAL follow-up step: LLM-grader variance would create flaky CI if
# the audit were a hard gate. This workflow's job is to STAGE the artefact
# (a deterministic JSON reading + a markdown wrapper) on a regular cadence;
# a human triggers the reviewer agent against the staged artefact and
# files the verdict separately.

on:
  schedule:
    # 1st of every 3rd month at 00:00 UTC — quarterly cadence.
    # (Jan 1, Apr 1, Jul 1, Oct 1.)
    - cron: "0 0 1 */3 *"
  workflow_dispatch: {}  # manual trigger for ad-hoc audits

permissions:
  contents: write
  pull-requests: write

jobs:
  stage-audit:
    name: Stage Bangalore-baseline reading
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute audit timestamp
        id: ts
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          # Q1 = months 01-03, Q2 = 04-06, Q3 = 07-09, Q4 = 10-12
          QUARTER=$(( (10#$MONTH - 1) / 3 + 1 ))
          echo "year=${YEAR}" >> "$GITHUB_OUTPUT"
          echo "quarter=Q${QUARTER}" >> "$GITHUB_OUTPUT"
          echo "slug=${YEAR}-Q${QUARTER}" >> "$GITHUB_OUTPUT"

      - name: Generate Bangalore-baseline reading
        run: |
          mkdir -p docs/audits
          python -m app.reading.cli \
            --dob 1990-07-15 \
            --time 12:00 \
            --tz +05:30 \
            --lat 12.97 \
            --lon 77.59 \
            --out "docs/audits/doctrine-${{ steps.ts.outputs.slug }}.json"

      - name: Write audit-prompt markdown
        run: |
          cat > "docs/audits/doctrine-${{ steps.ts.outputs.slug }}.md" <<'EOF'
          # Doctrine audit — ${{ steps.ts.outputs.year }} ${{ steps.ts.outputs.quarter }}

          ## NOT a blocking CI gate

          Per spec Section 7, this audit is **report-only**. LLM-grader
          variance makes a hard CI gate flaky; instead this workflow stages
          a deterministic Bangalore-baseline reading on a quarterly cadence
          and a human dispatches the `bphs-doctrine-reviewer` agent against
          the staged JSON. The agent's verdict is filed separately.

          ## Inputs

          The canonical Bangalore baseline pinned in `CLAUDE.md`:

          ```
          --dob 1990-07-15 --time 12:00 --tz +05:30 --lat 12.97 --lon 77.59
          ```

          ## Artefact

          See [`doctrine-${{ steps.ts.outputs.slug }}.json`](./doctrine-${{ steps.ts.outputs.slug }}.json).

          ## Manual follow-up

          1. Open the staged JSON.
          2. Dispatch the `bphs-doctrine-reviewer` agent (see
             `.claude/agents/bphs-doctrine-reviewer.md`) with the JSON as
             input.
          3. File the reviewer's verdict in `docs/audits/verdicts/`.

          ## Sanity checks the reviewer should confirm

          - `meta.schema_version == "1.0.0"`
          - `meta.doctrine_config` echoes the locked D-1..D-16 defaults
          - `chart.lagna_longitude` ≈ 173.99° (Virgo lagna)
          - Mercury MD is current at the reading-generation date
          - All 6 domains are populated
          - `warnings == []`
          EOF

      - name: Create pull request with staged audit
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/doctrine-audit-${{ steps.ts.outputs.slug }}
          title: "chore(audit): stage ${{ steps.ts.outputs.year }} ${{ steps.ts.outputs.quarter }} doctrine audit"
          commit-message: "chore(audit): stage ${{ steps.ts.outputs.year }} ${{ steps.ts.outputs.quarter }} doctrine audit"
          body: |
            Quarterly Bangalore-baseline reading staged for manual review by
            the `bphs-doctrine-reviewer` agent.

            **This PR is NOT a blocking CI gate.** Per spec Section 7,
            LLM-grader variance would make a hard CI gate flaky; this PR
            merely stages the artefact.

            Manual follow-up:
            1. Open `docs/audits/doctrine-${{ steps.ts.outputs.slug }}.json`
            2. Dispatch `bphs-doctrine-reviewer`
            3. File the verdict in `docs/audits/verdicts/`
          add-paths: |
            docs/audits/
