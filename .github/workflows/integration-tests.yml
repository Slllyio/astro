name: Integration tests

on:
  push:
    branches: [feat/integration, main]
    paths:
      - "app/integration/**"
      - "app/api/reading_integrated_routes.py"
      - "app/templates/reading_integrated_*.html"
      - "tests/integration/**"
      - "tests/api/test_reading_integrated_routes.py"
      - ".github/workflows/integration-tests.yml"
  pull_request:
    branches: [feat/integration, main]
    paths:
      - "app/integration/**"
      - "app/api/reading_integrated_routes.py"
      - "tests/integration/**"
      - "tests/api/test_reading_integrated_routes.py"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Project deps + test extras. The repo's pyproject.toml + requirements.txt
          # are the canonical dependency source.
          python -m pip install -r requirements.txt || python -m pip install -e ".[dev]"
          python -m pip install pytest pytest-asyncio httpx

      - name: Run integration tests
        run: |
          py -3.12 -m pytest tests/integration/ tests/api/test_reading_integrated_routes.py \
            -q --tb=short --maxfail=5

      - name: Generate test report
        if: failure()
        run: |
          py -3.12 -m pytest tests/integration/ tests/api/test_reading_integrated_routes.py \
            -v --tb=long
