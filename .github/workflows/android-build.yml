name: Build Android APK

# Builds a shareable debug .apk in CI (GitHub runners have the Android SDK,
# so you do NOT need Android Studio locally). Download it from the run's
# "Artifacts" and share it on WhatsApp.
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Deployed backend URL (https://...). Leave blank to make the app prompt on first launch."
        required: false
        default: ""
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.3

      - name: Build debug APK
        working-directory: android
        run: >-
          ./gradlew :app:assembleDebug
          -PBACKEND_URL="${{ github.event.inputs.backend_url || vars.BACKEND_URL || 'https://REPLACE_ME' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kundli-reading-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
