name: CI

on:
  push:
    branches: [main, main-aug]
  pull_request:
    branches: [main, main-aug]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        # The suite measures ~66% on a corpus-less machine (CI has no vendored
        # doctrine corpus or generated ML parquets — those tests skip). The gate
        # sits just under that so it catches regressions while staying passable;
        # raise it as real coverage climbs, never above what CI can measure.
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=64

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14
