android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# ── The one value you must set ──────────────────────────────────────────────
# The public HTTPS address where the reading engine (this FastAPI app) is
# hosted. The app opens <BACKEND_URL>/reading/v15/ on launch.
# Leave the placeholder to have the app prompt for it on first launch instead.
# In CI you can override it: gradle assembleDebug -PBACKEND_URL="https://your-host"
BACKEND_URL=https://REPLACE_ME
